name: Build and Package Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Get short commit hash and dynamic version
        id: vars
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha_short=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Current Short SHA: $SHORT_SHA"

          # 动态解析版本号 (优先读取 Git 标签，否则结合 package.json 与 short sha)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            VER="v${PKG_VER}-${SHORT_SHA}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Resolved Version: $VER"

      - name: Install dependencies
        run: npm ci

      - name: Build React UI bundle
        run: npm run build
        env:
          COMMIT_HASH: ${{ steps.vars.outputs.sha_short }}
          APP_VERSION: ${{ steps.vars.outputs.version }}

      - name: Assemble release package
        shell: pwsh
        run: |
          $pkgDir = "AutoIME"
          if (Test-Path $pkgDir) { Remove-Item $pkgDir -Recurse -Force }
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/core" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/ui" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/ui/html" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/lib" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/lib/WebView2" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/lib/WebView2/32bit" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/lib/WebView2/64bit" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/lang" | Out-Null

          # Copy core & ui scripts
          Copy-Item "AutoIME.ahk" "$pkgDir/"
          Copy-Item "version.json" "$pkgDir/"
          Copy-Item "AutoIME_config.example.ini" "$pkgDir/"
          Copy-Item "LICENSE" "$pkgDir/"
          Copy-Item "README.md" "$pkgDir/"
          Copy-Item "README_zh.md" "$pkgDir/"
          Copy-Item "README_ja.md" "$pkgDir/"

          Copy-Item "core/*.ahk" "$pkgDir/core/"
          Copy-Item "ui/*.ahk" "$pkgDir/ui/"
          Copy-Item "ui/html/index.html" "$pkgDir/ui/html/"
          Copy-Item "ui/html/style.css" "$pkgDir/ui/html/"
          Copy-Item "ui/html/app.bundle.js" "$pkgDir/ui/html/"

          Copy-Item "lib/*.ahk" "$pkgDir/lib/"
          Copy-Item "lib/WebView2/WebView2.ahk" "$pkgDir/lib/WebView2/"
          Copy-Item "lib/WebView2/32bit/WebView2Loader.dll" "$pkgDir/lib/WebView2/32bit/"
          Copy-Item "lib/WebView2/64bit/WebView2Loader.dll" "$pkgDir/lib/WebView2/64bit/"

          Copy-Item "lang/*.ini" "$pkgDir/lang/"

          $zipName = "AutoIME-${{ steps.vars.outputs.sha_short }}.zip"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath $zipName -Force
          Write-Host "Created release archive: $zipName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoIME-${{ steps.vars.outputs.sha_short }}
          path: AutoIME-${{ steps.vars.outputs.sha_short }}.zip
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: AutoIME ${{ steps.vars.outputs.version }}
          body: |
            ### AutoIME 自动化持续构建发布 (CI)
            - **Commit**: [${{ steps.vars.outputs.sha_short }}](https://github.com/kyuuseiryuu/AutoIME/commit/${{ github.sha }})
            - **发布版本**: `${{ steps.vars.outputs.version }}`
            - **打包清单**: 仅包含运行必需的 AHK 核心模块、现代 WebView2 离线资源包及语言字典。
          files: AutoIME-${{ steps.vars.outputs.sha_short }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

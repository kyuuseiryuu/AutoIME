<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoIME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;background:#fff;white-space:pre-wrap;font-size:14px;"><strong>JS Error:</strong> ' + e.message + '\n<strong>File:</strong> ' + e.filename + ':' + e.lineno + '\n<strong>Stack:</strong> ' + (e.error ? e.error.stack : 'none') + '</div>';
    });
  </script>
  <script src="app.bundle.js"></script>
</body>
</html>
